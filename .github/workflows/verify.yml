name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  assertions:
    runs-on: ubuntu-latest
    steps:
      - name: 本仓
        uses: actions/checkout@v4
        with:
          path: provider

      # 验证宿主借核心的 PluginManagerHost。它按 ../.. 找这个目录，所以位置要照着摆。
      - name: 核心
        uses: actions/checkout@v4
        with:
          repository: HosihikariFramework/PluginManagement
          path: Hosihikari.PluginManager

      # 契约与核心一起改：并列摆放才能编到新契约。
      - name: 契约
        uses: actions/checkout@v4
        with:
          repository: HosihikariFramework/Abstractions
          path: Hosihikari.Abstractions

      # 本机库的 RID 优先解析需要 fork；核心按 ../.. 找它。
      - name: McMaster fork
        uses: actions/checkout@v4
        with:
          repository: HosihikariFramework/Hosihikari.McMaster.NETCore.Plugins
          path: Hosihikari.McMaster.NETCore.Plugins

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 断言里有真正的子进程，运行时由 setup-node 提供。
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      # Java 与 Kotlin 绑定需要一个 JDK；Kotlin 编译器随后单独下载。
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Kotlin
        run: |
          curl -sSL -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip
          unzip -q kotlin.zip
          echo "$PWD/kotlinc/bin" >> "$GITHUB_PATH"

      # QuickJS 绑定的断言需要一个 qjs。用 quickjs-ng 的发布二进制，不自己编。
      - name: quickjs
        run: |
          curl -sSL -o qjs https://github.com/quickjs-ng/quickjs/releases/download/v0.17.0/qjs-linux-x86_64
          chmod +x qjs
          sudo mv qjs /usr/local/bin/qjs
          qjs --version

      - name: 跑断言
        working-directory: provider
        env:
          HOSIHIKARI_REQUIRE_JAVA: '1'
          HOSIHIKARI_REQUIRE_KOTLIN: '1'
        run: dotnet run --project host/Hosihikari.PluginProvider.Rpc.Host.csproj -c Release --nologo

      - name: 进程监督与协议顺序回归
        working-directory: provider
        run: dotnet run --project test/Hosihikari.PluginProvider.Rpc.Regression.csproj -c Release --nologo
